# Hardening phase — architectural quality gate: every PR must pass the same
# chain the repo's commits do. Browser E2E stays out (needs a real Chrome +
# display; the rigs are local gates — see tests/e2e/).
name: ci
on:
  push:
    branches: [main, migration/**]
  pull_request:

jobs:
  gates:
    # pinned runner — ubuntu-latest migrates to Ubuntu 26 (runner-images#14748)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED to the version the repo is developed and tested with.
          # POLICY: Bun upgrades are DEDICATED commits (bump this pin + run the
          # full gate) — they never ride along with feature/fix changes.
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (strict + noImplicitAny)
        run: bun run typecheck
      - name: Lint (tightened TS rules)
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build + WXT parity (byte-identical output contract)
        run: bun run build:wxt
