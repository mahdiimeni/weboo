<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>popover E2E — جعبه‌ی یادداشت (v0.5.1)</title>
<!--
  Web Highlighter — hand-written E2E page for the NotePopover widget.

  The popover is a content-script widget (Shadow DOM on the host page) and has
  no chrome.* dependency, so — unlike the popup/dashboard harnesses — this page
  is static: it loads the REAL shared scripts via relative paths and presents
  two popovers side by side (the two v0.5.1 note-box states):
    A (چپ)  : بدون یادداشت → قرص وسط‌چین «افزودن یادداشت»
    B (راست): با یادداشت   → دکمه‌ی فقط-آیکونی قلم
  Drive it with agent-browser (file://): screenshots, pill/pen click flows,
  save round-trip, dark theme via HL.ui.setTheme, geometry checks on the
  shadow roots through the page (window.__poA / window.__poB).
  Not part of the shipped package (tests/ never ships; the zip packs extension/).
-->
<style>
  body { font-family: Vazirmatn, 'Segoe UI', Tahoma, sans-serif; background: #f8fafc;
         margin: 0; padding: 28px 32px 120px; direction: rtl; }
  h1 { font-size: 15px; color: #334155; margin: 0 0 6px; }
  p  { font-size: 12px; color: #64748b; margin: 0; }
  .row { display: flex; justify-content: space-between; margin-top: 80px; }
  .anchor { display: inline-block; width: 190px; height: 26px; line-height: 26px;
            text-align: center; font-size: 12px; background: #fef3c7; color: #78350f;
            border-radius: 6px; border: 1px solid #fcd34d; }
</style>
</head>
<body>
<h1>NotePopover E2E — دو حالت جعبه‌ی یادداشت</h1>
<p>پاپ‌اور A: بدون یادداشت (قرص افزودن) · پاپ‌اور B: با یادداشت (آیکون قلم)</p>

<div class="row">
  <span class="anchor" id="a2">هایلایت با یادداشت</span>
  <span class="anchor" id="a1">هایلایت بدون یادداشت</span>
</div>

<!-- the real shared engine, in the manifest's dependency order -->
<script src="../../extension/shared/constants.js"></script>
<script src="../../extension/shared/utils.js"></script>
<script src="../../extension/shared/format.js"></script>
<script src="../../extension/shared/detect-dir.js"></script>
<script src="../../extension/shared/ui/base.js"></script>
<script src="../../extension/shared/ui/popover.js"></script>
<script>
(function () {
  'use strict';
  var DATA_A = {
    id: 'A1', color: 'yellow', note: '',
    quote: 'متن هایلایت‌شده‌ی نمونه برای آزمون حالتِ بدون یادداشت',
    createdAt: 1700000000000
  };
  var DATA_B = {
    id: 'B1', color: 'green', note: 'یادداشت موجود برای این هایلایت',
    quote: 'The quick brown fox jumps over the lazy dog',
    createdAt: 1700000000000
  };
  window.__saved = [];

  function make(id) {
    return new HL.ui.NotePopover({
      onSaveNote: function (rid, val) { window.__saved.push([id, rid, val]); },
      onColorChange: function () {}, onDelete: function () {},
      onCopy: function () {}, onClose: function () {}
    });
  }
  window.__poA = make('A');
  window.__poB = make('B');

  window.__presentA = function () {
    window.__poA.present(Object.assign({}, DATA_A, {
      rect: document.getElementById('a1').getBoundingClientRect()
    }));
  };
  window.__presentB = function () {
    window.__poB.present(Object.assign({}, DATA_B, {
      rect: document.getElementById('a2').getBoundingClientRect()
    }));
  };
  window.__presentA();
  window.__presentB();
})();
</script>
</body>
</html>
